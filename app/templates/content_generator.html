{% extends "base_navbar.html" %}

{% block title %}{{ document.document_name }}{% endblock %}

{% block extra_css %}
<!-- Quill Editor CSS -->
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container-fluid mb-5">
    <!-- Editable Section -->
    <div class="editable-section-content d-flex align-items-start mt-4">
        <div contenteditable="true" id="input-box" class="p-3 border rounded bg-white w-100 shadow-sm">
            <p>This is a textbox</p>
        </div>
    </div>

    <!-- View Panel -->
    <div class="mt-4">
        <div id="view-panel" class="p-3 border rounded bg-light shadow-sm" style="min-height: 100px;">
            <p class="text-muted">Generated content will appear here...</p>
        </div>
    </div>

    <!-- Generate Button -->
    <div class="mt-3">
        <button class="btn btn-warning api-call">
            <i class="bi bi-lightning-charge"></i> Click to generate content
        </button>
    </div>
</div>

<div class="container-fluid mb-5">
    <!-- Editable Section -->
    <div class="editable-section-content d-flex align-items-start mt-4">
        <div contenteditable="true" id="editor" class="w-100 shadow-sm">
            {{ loaded_content|safe }}
        </div>
    </div>


    <!-- Export & Save Buttons -->
    <div class="mt-3 d-flex gap-2">

        <button class="btn btn-light" id="save-btn" onclick="saveDocument()">
            <i class="bi bi-floppy"></i> Save
        </button>
    </div>
</div>
{% endblock %}

{% block extra_js %}


<script> 
const SAVE_URL = "{{ url_for('main.save_document', document_id=document.id) }}"; 
async function saveDocument() { 
    const content = document.getElementById("editor").innerHTML; 
    const contentDict = {'content': content};
    console.log("Save request sent");

    fetch(SAVE_URL, { 
        method: "POST", 
        headers: { "Content-Type": "application/json" }, 
        body: JSON.stringify(contentDict) 
    }) 
    .then(response => { 
        if (!response.ok) console.error("Save failed"); 
    }) 
    .catch(err => console.error('Save error:', err)); 
    } 

    </script>

    <script src="{{ url_for('static', filename='content_generator.js') }}"></script>
{% endblock %}
