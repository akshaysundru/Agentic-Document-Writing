{% extends "base_navbar.html" %}

{% block title %}Content Generation{% endblock %}

{% block extra_css %}
<!-- Quill Editor CSS -->
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container-fluid mb-5">
    <!-- Editable Section -->
    <div class="editable-section-content d-flex align-items-start mt-4">
        <div contenteditable="true" id="input-box" class="p-3 border rounded bg-white w-100 shadow-sm">
            <p>This is a textbox</p>
        </div>
    </div>

    <!-- View Panel -->
    <div class="mt-4">
        <div id="view-panel" class="p-3 border rounded bg-light shadow-sm" style="min-height: 100px;">
            <p class="text-muted">Generated content will appear here...</p>
        </div>
    </div>

    <!-- Generate Button -->
    <div class="mt-3">
        <button class="btn btn-warning api-call">
            <i class="bi bi-lightning-charge"></i> Click to generate content
        </button>
    </div>
</div>

<!-- Editor container -->
<div id="editor" class="container-fluid bg-light mt-4 p-3 rounded shadow-sm">
    <p>Hello World!</p>
    <p>Some initial <strong>bold</strong> text</p>
    <p><br /></p>
</div>

<!-- Export Button -->
<div class="mt-3">
    <button class="btn btn-light" id="export-btn">
        <i class="bi bi-file-earmark-word-fill"></i> Export to Word
    </button>
</div>
{% endblock %}

{% block extra_js %}
<!-- Quill library -->
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

<!-- Initialize Quill editor -->
<script>
    const toolbarOptions = [
        [{ font: ['sans-serif', 'serif', 'monospace', 'Arial', 'Times New Roman', 'Courier New'] }],
        [{ size: ['small', false, 'large', 'huge'] }],
        ['bold', 'italic', 'underline'],
        [{ color: [] }, { background: [] }],
        [{ list: 'ordered'}, { list: 'bullet' }],
        ['clean']
    ];

    const quill = new Quill('#editor', {
        theme: 'snow',
        modules: { toolbar: toolbarOptions }
    });
</script>

<script src="{{ url_for('static', filename='content_generator.js') }}"></script>
{% endblock %}
