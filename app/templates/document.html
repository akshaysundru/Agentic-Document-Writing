<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{title}}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
          crossorigin="anonymous">

<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="big-blue">

<!-- Render all sections -->
<div class="container-fluid d-flex align-items-start mt-4">
    <div class="flex-column w-75 bg p-4">
        {% for sec in sections %}
            {% if sec.header and sec.header.strip() %}
                <div class="editable-section-header" contenteditable="true" data-id="{{ sec.id }}">
                    {{ sec.header | safe }}
                </div>
            {% endif %}
            {% if sec.content and sec.content.strip() %}
                <div class="editable-section-content"  data-id="{{ sec.id }}">
                    <div contenteditable="true">
                    <p>{{ sec.content | safe }}</p>  
                    </div> 
                    <button class="btn action-btn bg-primary" data-action="clean">Clean</button>
                    <button class="btn action-btn eve-green g-3" data-action="suggest">Suggest</button>
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <div class="w-25 bg-secondary text-white p-4 ms-3">
        <h1><strong>Editor Panel</strong></h1>
        <p>View cleaned HTML here:</p>
        <div id="editor-panel"></div>
        <button id="apply-btn" class="btn">Apply Changes</button>
    </div>

    
</div>

    <div class="d-flex justify-content-center align-items-center p-4">
        <button class="btn weird-orange text-white g-3">Export to markdown</button>
        <button id="saveBtn" class="btn action-btn pink-lady text-white g-3">Save All Changes</button>
        <button id="addHeader" class="btn addSection g-3">Add Header</button>
        <button id="addContent" class="btn addSection g-3">Add content</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

<script>
    document.querySelectorAll(".action-btn").forEach(btn => {
        btn.addEventListener("click", async function() {
            const parent = this.parentElement;  // grabs the .editable-section
            const contentDiv = parent.querySelector("div[contenteditable]");
            if (!contentDiv) return;

            const htmlContent = contentDiv.innerHTML;  //we get the content in the editable panel as a string and its database ID
            const idAttr = parseInt(parent.getAttribute("data-id"));

            const payload = {
                html: htmlContent,
                id: idAttr
            }; //creates the dict/object that we use to send to the route
            console.log("Payload sent:", payload);

            let route;
            if (this.dataset.action === "clean") {
                route = "{{ url_for('main.clean_section') }}";
            } else if (this.dataset.action === "suggest") {
                route = "{{ url_for('main.suggestions') }}";
            }  //route selection between the cleaning and suggesting function since both work similarly except for prompt used

            //try catch block wrapper just to diagnose errors
            try {
                const response = await fetch(route, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }); //feeds the information through the selected route

                const data = await response.json(); //response of the route
                if (!data.ok) {
                    console.error("Server error:", data.error);
                    return;
                } //error raise if data isn't accepted

                if (this.dataset.action === "clean") {
                    contentDiv.innerHTML = data.cleaned_html; //overwrite panel with grammatical and spatial writeup
                } else if (this.dataset.action === "suggest") {
                    document.getElementById("editor-panel").innerHTML = data.cleaned_html;
                } //suggested data is outputted into the editor panel for review purposes

                // Store metadata so we know which section it belongs to
                const applyBtn = document.getElementById("apply-btn");
                applyBtn.dataset.id = idAttr;
                applyBtn.dataset.html = data.cleaned_html;
            } catch (err) {
                console.error("Request failed:", err);
            }
        });
    });

    document.getElementById("apply-btn").addEventListener("click", async function () {
        const id = this.dataset.id;
        const newHtml = this.dataset.html;

        if (!id || !newHtml) {
            console.error("No suggestion to apply.");
            return;
        }

        // 1. Update the UI section (make sure class matches your HTML!)
        const target = document.querySelector(`.editable-section-content[data-id="${id}"] div[contenteditable]`);
        if (target) {
            target.innerHTML = newHtml;
        } else {
            console.error("Target section not found for id:", id);
            return;
        }

        // 2. Send update to /save
        const payload = {
            sections: [
                {
                    id: parseInt(id),
                    header: null,       // unchanged
                    content: newHtml    // overwrite with suggestion
                }
            ]
        };

        try {
            const response = await fetch("{{ url_for('main.save_sections') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            console.log("Save response:", data.message || data);
            alert(data.message || "Changes applied and saved!");
            
            // Optional: clear suggestion panel after apply
            document.getElementById("editor-panel").innerHTML = "";
            this.dataset.id = "";
            this.dataset.html = "";
        } catch (err) {
            console.error("Save request failed:", err);
        }
    });


    // Save Function that actually sends the data to the server
    document.getElementById("saveBtn").addEventListener("click", function() {
        
        let updates = [];

        // grab headers
        document.querySelectorAll(".editable-section-header").forEach(el => {
            updates.push({
                id: el.dataset.id,
                header: el.innerHTML.trim(),
                content: null
            });
        });

        // grab contents
        document.querySelectorAll(".editable-section-content").forEach(el => {
            let contentEl = el.querySelector("[contenteditable]");
            updates.push({
                id: el.dataset.id,
                header: null,
                content: contentEl.innerHTML.trim()
            });
        });

        fetch("/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sections: updates })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message || "Saved!");
        })
        .catch(err => console.error("Save error:", err));
    })

    document.querySelectorAll(".addSection").forEach(btn => {
        btn.addEventListener("click", function() {
            const container = document.querySelector(".container-fluid .w-75"); // main content column
            const type = btn.id === "addHeader" ? "header" : "content"; // decide what to add

            // create a new section wrapper
            const newSection = document.createElement("div");
            newSection.dataset.id = "new-" + Date.now(); // temporary unique ID
            newSection.classList.add("mt-3", "p-3", "border", "rounded");

            if (type === "header") {
                newSection.classList.add("editable-section-header");
                newSection.setAttribute("contenteditable", "true");
                newSection.innerHTML = "<h3>New Header</h3>";
            } else if (type === "content") {
                newSection.classList.add("editable-section-content");

                // content editable div
                const contentDiv = document.createElement("div");
                contentDiv.setAttribute("contenteditable", "true");
                contentDiv.innerHTML = "<p>New section content...</p>";

                // clean + suggest buttons
                const cleanBtn = document.createElement("button");
                cleanBtn.classList.add("btn", "action-btn", "bg-primary", "me-2");
                cleanBtn.dataset.action = "clean";
                cleanBtn.textContent = "Clean";

                const suggestBtn = document.createElement("button");
                suggestBtn.classList.add("btn", "action-btn", "eve-green");
                suggestBtn.dataset.action = "suggest";
                suggestBtn.textContent = "Suggest";

                newSection.appendChild(contentDiv);
                newSection.appendChild(cleanBtn);
                newSection.appendChild(suggestBtn);
            }

            // append to container
            container.appendChild(newSection);

            // focus immediately for convenience
            newSection.focus();
            console.log("✅ New section added:", type);
        });
    });


</script>

</body>
</html>
